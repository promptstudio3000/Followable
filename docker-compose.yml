services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: followable
    ports:
      # Host 5433 avoids clashing with a local Postgres already bound to 127.0.0.1:5432
      - "5433:5432"
    volumes:
      - followable_pgdata:/var/lib/postgresql/data

volumes:
  followable_pgdata:
